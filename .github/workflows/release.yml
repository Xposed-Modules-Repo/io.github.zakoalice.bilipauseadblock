name: Release module APK

# 模块仓库只放元信息（SUMMARY / README.md），APK 由源码仓库的 Release 提供。
# 推送 <versionCode>-<versionName> 形式的 tag 时，一次性创建 Release 并附上 APK：
# 官方 bot 靠「创建 Release 时就带 asset」这个 webhook 来同步，事后补 asset 不会触发。
on:
  push:
    tags:
      - '[0-9]*-[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch signed APK from source repo release
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o BiliPauseAdBlock-1.0.apk \
            https://github.com/ZakoAlice/BiliPauseAdBlock/releases/download/1.0-1/BiliPauseAdBlock-v1.0.apk
          test -s BiliPauseAdBlock-1.0.apk
          echo "APK: $(stat -c%s BiliPauseAdBlock-1.0.apk) bytes"

      - name: Create release with APK attached in one shot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "1.0" \
            --notes "BiliPauseAdBlock 1.0 - 屏蔽哔哩哔哩暂停视频广告" \
            BiliPauseAdBlock-1.0.apk
